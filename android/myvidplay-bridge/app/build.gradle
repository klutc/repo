    buildToolsVersion '30.0.2'
    defaultConfig {
        applicationId 'org.klutc.myvidplaybridge'
        minSdkVersion 21
        targetSdkVersion 24
        versionCode 3
        versionName '0.2.1'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
